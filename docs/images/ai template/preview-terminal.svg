<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" width="360" height="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF7A1A"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- Phone Frame -->
  <rect x="4" y="4" width="352" height="712" rx="34" fill="url(#bgGrad3)" stroke="#334155" stroke-width="3"/>

  <!-- Status Bar -->
  <text x="26" y="34" fill="#94A3B8" font-size="12" font-weight="600">14:40</text>
  <text x="242" y="34" fill="#94A3B8" font-size="11" font-weight="600">5G  iPhone  88%</text>

  <!-- Chat Header -->
  <rect x="14" y="48" width="332" height="50" rx="14" fill="#1E293B"/>
  <circle cx="42" cy="73" r="15" fill="url(#accentGrad3)"/>
  <text x="42" y="79" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">t</text>
  <text x="66" y="70" fill="#F8FAFC" font-size="14" font-weight="700">T-Switch Terminal</text>
  <text x="66" y="86" fill="#34D399" font-size="10" font-weight="600">● Çevrimiçi · SIP TLS Komut Kanalı</text>

  <!-- Outgoing Command 1 -->
  <rect x="196" y="114" width="140" height="36" rx="14" fill="url(#accentGrad3)"/>
  <text x="212" y="137" fill="#FFFFFF" font-size="13" font-weight="700" font-family="monospace">!geneldurum</text>

  <!-- Incoming Reply 1 -->
  <rect x="20" y="160" width="286" height="122" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="34" y="182" fill="#FF7A1A" font-size="11" font-weight="800">📊 [T-Switch Genel Durum]</text>
  <text x="34" y="202" fill="#E2E8F0" font-size="11" font-family="monospace">• Batarya : %92 (Şarjda) · 31.2°C</text>
  <text x="34" y="220" fill="#E2E8F0" font-size="11" font-family="monospace">• Şebeke  : LTE (-84 dBm)</text>
  <text x="34" y="238" fill="#E2E8F0" font-size="11" font-family="monospace">• SIP     : Kayıtlı (TLS 5061)</text>
  <text x="34" y="256" fill="#E2E8F0" font-size="11" font-family="monospace">• Kiosk   : Aktif (Ekran Kapalı)</text>
  <text x="34" y="274" fill="#34D399" font-size="10">14:38 ✓</text>

  <!-- Outgoing Command 2 -->
  <rect x="176" y="294" width="160" height="36" rx="14" fill="url(#accentGrad3)"/>
  <text x="192" y="317" fill="#FFFFFF" font-size="13" font-weight="700" font-family="monospace">!ara Ahmet Yılmaz</text>

  <!-- Incoming Reply 2 -->
  <rect x="20" y="340" width="292" height="72" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="34" y="362" fill="#F8FAFC" font-size="11" font-weight="700">📞 Aranıyor: Ahmet Yılmaz</text>
  <text x="34" y="380" fill="#CBD5E1" font-size="11">Önce iPhone çalacak, açtığınızda</text>
  <text x="34" y="396" fill="#CBD5E1" font-size="11">karşı taraf GSM hattından aranacak.</text>

  <!-- Outgoing Command 3 -->
  <rect x="120" y="424" width="216" height="36" rx="14" fill="url(#accentGrad3)"/>
  <text x="136" y="447" fill="#FFFFFF" font-size="12" font-weight="700" font-family="monospace">!sms Ahmet 10 dk'ya oradayım</text>

  <!-- Incoming Reply 3 -->
  <rect x="20" y="470" width="270" height="44" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="34" y="497" fill="#34D399" font-size="11" font-weight="700">✉️ SMS gönderiliyor: Ahmet Yılmaz</text>

  <!-- Forwarded Incoming GSM SMS -->
  <rect x="20" y="528" width="296" height="84" rx="14" fill="#1E293B" stroke="#60A5FA" stroke-width="1.2"/>
  <text x="34" y="550" fill="#60A5FA" font-size="11" font-weight="800">📩 [+90 5XX XXX XX 10]</text>
  <text x="34" y="570" fill="#F8FAFC" font-size="12">Tamamdır, kapıda bekliyorum.</text>
  <text x="34" y="596" fill="#64748B" font-size="10">GSM SMS → SIP Bulut Aktarımı · 14:40</text>

  <!-- Input Bar -->
  <rect x="18" y="646" width="272" height="42" rx="21" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="36" y="672" fill="#64748B" font-size="12">Komut yazın (!ara, !sms, !yardim)…</text>
  <circle cx="318" cy="667" r="21" fill="url(#accentGrad3)"/>
  <text x="318" y="672" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">➤</text>
</svg>
