<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" width="360" height="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF7A1A"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- Phone Frame -->
  <rect x="4" y="4" width="352" height="712" rx="34" fill="url(#bgGrad2)" stroke="#334155" stroke-width="3"/>

  <!-- Status Bar -->
  <text x="26" y="34" fill="#94A3B8" font-size="12" font-weight="600">14:35</text>
  <text x="242" y="34" fill="#94A3B8" font-size="11" font-weight="600">LTE  Wi-Fi  92%</text>

  <!-- Header -->
  <rect x="20" y="50" width="36" height="36" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="38" y="73" text-anchor="middle" fill="#F8FAFC" font-size="16">←</text>
  <text x="68" y="74" fill="#F8FAFC" font-size="19" font-weight="800">Ayarlar</text>
  <rect x="244" y="56" width="48" height="24" rx="12" fill="#1E293B"/>
  <text x="268" y="72" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="700">v2.0</text>
  <rect x="300" y="50" width="36" height="36" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="318" y="73" text-anchor="middle" fill="#CBD5E1" font-size="14">☰</text>

  <!-- Kiosk & Local Send Card -->
  <rect x="20" y="100" width="320" height="120" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="34" y="122" fill="#FF7A1A" font-size="12" font-weight="800">Kiosk &amp; Local Send Otomasyonu</text>
  <rect x="32" y="132" width="296" height="36" rx="10" fill="#0F172A"/>
  <text x="44" y="154" fill="#F8FAFC" font-size="11" font-weight="700">Kiosk Launcher</text>
  <rect x="246" y="138" width="72" height="24" rx="12" fill="#16A34A"/>
  <text x="282" y="154" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">Kiosk Açık</text>
  <rect x="32" y="176" width="94" height="30" rx="8" fill="#334155"/>
  <text x="79" y="195" text-anchor="middle" fill="#F8FAFC" font-size="10" font-weight="700">⚡ Debloat</text>
  <rect x="133" y="176" width="94" height="30" rx="8" fill="#334155"/>
  <text x="180" y="195" text-anchor="middle" fill="#F8FAFC" font-size="10" font-weight="700">📶 Kalan GB</text>
  <rect x="234" y="176" width="94" height="30" rx="8" fill="#334155"/>
  <text x="281" y="195" text-anchor="middle" fill="#F8FAFC" font-size="10" font-weight="700">🌙 Ekran Kapat</text>

  <!-- Linphone PushKit Card -->
  <rect x="20" y="232" width="320" height="314" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="34" y="256" fill="#FF7A1A" font-size="12" font-weight="800">Linphone Hibrit PushKit (Uyandırıcı)</text>
  <rect x="266" y="240" width="60" height="22" rx="11" fill="#0F172A"/>
  <text x="296" y="255" text-anchor="middle" fill="#34D399" font-size="10" font-weight="700">Aktif ✓</text>

  <text x="34" y="280" fill="#94A3B8" font-size="10" font-weight="700">Linphone SIP Domain</text>
  <rect x="34" y="286" width="292" height="32" rx="8" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="46" y="306" fill="#F8FAFC" font-size="12" font-family="monospace">sip.linphone.org</text>

  <text x="34" y="336" fill="#94A3B8" font-size="10" font-weight="700">Gateway Gönderici Hesabı (Pusher)</text>
  <rect x="34" y="342" width="292" height="32" rx="8" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="46" y="362" fill="#F8FAFC" font-size="12" font-family="monospace">my_gateway_sip</text>

  <text x="34" y="392" fill="#94A3B8" font-size="10" font-weight="700">Gönderici SIP Şifresi</text>
  <rect x="34" y="398" width="292" height="32" rx="8" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="46" y="418" fill="#94A3B8" font-size="12" font-family="monospace">••••••••••••</text>

  <text x="34" y="448" fill="#94A3B8" font-size="10" font-weight="700">iPhone Alıcı Hesabı (Receiver)</text>
  <rect x="34" y="454" width="292" height="32" rx="8" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="46" y="474" fill="#F8FAFC" font-size="12" font-family="monospace">my_iphone_sip</text>

  <!-- Push Buttons -->
  <rect x="34" y="498" width="140" height="34" rx="10" fill="url(#accentGrad2)"/>
  <text x="104" y="519" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">Push Kaydet</text>
  <rect x="186" y="498" width="140" height="34" rx="10" fill="#334155"/>
  <text x="256" y="519" text-anchor="middle" fill="#F8FAFC" font-size="12" font-weight="700">PushKit Test</text>

  <!-- Audio Codec Card -->
  <rect x="20" y="558" width="320" height="84" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="34" y="580" fill="#FF7A1A" font-size="12" font-weight="800">Ses Kodeği &amp; Güvenlik</text>
  <circle cx="42" cy="602" r="6" fill="#FF7A1A"/>
  <text x="56" y="606" fill="#F8FAFC" font-size="11" font-weight="600">G.722 — Wideband 16 kHz (Önerilen)</text>
  <text x="36" y="628" fill="#94A3B8" font-size="11">☑ TLS Şifreleme (5061)   ☑ Otomatik Bağlan</text>

  <!-- Save Button -->
  <rect x="20" y="654" width="320" height="44" rx="14" fill="url(#accentGrad2)"/>
  <text x="180" y="681" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="800">KAYDET &amp; UYGULA</text>
</svg>
