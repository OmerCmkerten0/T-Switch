  <text x="61" y="676" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">Ana Panel</text>
  <text x="140" y="676" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="600">Tuş Takımı</text>
  <text x="220" y="676" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="600">Rehber</text>
  <text x="298" y="676" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="600">Ayarlar</text>
